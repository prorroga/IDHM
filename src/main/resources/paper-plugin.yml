name: IDHM
version: '@version@'
main: net.prorrogam.idhm.IDHM
api-version: '1.21'
folia-supported: true

authors: [prorroga]
description: '@description@'
website: https://github.com/prorroga/idhm

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false

permissions:
  idhm.currency.list:
    description: Allows listing currencies
    default: true
  idhm.balance:
    description: Allows checking own balance
    default: true
  idhm.pay:
    description: Allows paying other players
    default: true
  idhm.top:
    description: Allows viewing the leaderboard
    default: true
  idhm.admin.give:
    description: Allows giving currency to players
    default: op
  idhm.admin.take:
    description: Allows taking currency from players
    default: op
  idhm.admin.set:
    description: Allows setting a player's balance
    default: op
  idhm.admin.reset:
    description: Allows resetting a player's balance
    default: op
  idhm.admin.reload:
    description: Allows reloading the plugin configuration
    default: op
